  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      --glass-bg: rgba(15, 20, 32, 0.55);
      --glass-border: rgba(212, 175, 55, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Fixed Height for Mobile Screen Fit */
    html, body {
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(rgba(5, 8, 16, 0.82), rgba(5, 8, 16, 0.88)), 
                  url("https://i.ibb.co/yc08crzH/20250923-0635-Starry-Arabic-Skies-simple-compose-01k5t1nc7kf4y8jv4ma4ctgmwe.png") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      text-align: center;
      padding: 1rem 0.8rem;
    }

    /* Header Styling */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .arabic-title {
      font-family: 'Amiri', serif;
      font-size: 3rem;
      font-weight: 700;
      font-style: italic;
      line-height: 1;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
      transition: transform 0.3s ease;
      cursor: default;
    }

    .arabic-title:hover {
      transform: scale(1.03);
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      text-indent: 0.25em;
      background: linear-gradient(135deg, #ffffff 0%, #dfd0b5 50%, #c5a059 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 8px 16px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    h1::after {
      content: '';
      display: block;
      width: 60px;
      height: 2px;
      background: var(--gold-gradient);
      margin: 0.5rem auto 0;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
    }

    /* Main Section */
    main {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* Compact Outer Card */
    .card-container {
      position: relative;
      width: 260px;
      height: 260px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }

    .card-container:hover {
      border-color: rgba(212, 175, 55, 0.5);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7),
                  0 0 30px rgba(212, 175, 55, 0.2);
    }

    /* Animated Gold Orbit Ring */
    .orbit-ring {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 1.5px dashed rgba(212, 175, 55, 0.4);
      animation: rotate 25s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Vector SVG Arrows */
    .arrow-svg {
      position: absolute;
      width: 170px;
      height: 170px;
      z-index: 1;
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.4));
    }

    /* Language Buttons */
    .lang-pill {
      position: absolute;
      z-index: 2;
      padding: 0.45rem 1rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-radius: 50px;
      color: #fff;
      text-transform: uppercase;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .lang-pill:hover {
      transform: scale(1.08);
    }

    .lang-pill.arabic {
      top: 18px;
      background: linear-gradient(135deg, #800909, #d32f2f);
      border-color: rgba(255, 100, 100, 0.4);
    }

    .lang-pill.english {
      bottom: 35px;
      right: 12px;
      background: linear-gradient(135deg, #0d6241, #2e7d32);
      border-color: rgba(100, 255, 150, 0.4);
    }

    .lang-pill.malayalam {
      bottom: 35px;
      left: 12px;
      background: linear-gradient(135deg, #0d3b66, #1976d2);
      border-color: rgba(100, 180, 255, 0.4);
    }

    /* Footer Button */
    footer {
      display: flex;
      justify-content: center;
    }

    .home-btn {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      padding: 0.75rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .home-btn:hover {
      transform: translateY(-2px) scale(1.05);
      background: var(--gold-gradient);
      border-color: transparent;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5),
                  0 0 20px rgba(212, 175, 55, 0.5);
    }

    .home-btn img {
      width: 20px;
      height: 20px;
      filter: invert(1);
      transition: filter 0.3s ease;
    }

    .home-btn:hover img {
      filter: invert(0) brightness(0.2);
    }

    /* Small Screen Adjustment */
    @media (max-height: 650px) {
      .arabic-title { font-size: 2.4rem; }
      h1 { font-size: 1.3rem; }
      .card-container { width: 220px; height: 220px; }
      .orbit-ring, .arrow-svg { width: 140px; height: 140px; }
      .lang-pill { font-size: 0.65rem; padding: 0.35rem 0.8rem; }
      .lang-pill.arabic { top: 12px; }
      .lang-pill.english, .lang-pill.malayalam { bottom: 25px; }
    }
  </style>

          </linearGradient>

            <path d="M 0 1 L 9 5 L 0 9 z" fill="url(#gold-arrow)" />
          </marker>
        </defs>

        <path d="M 142 52 A 62 62 0 0 1 155 125" stroke="url(#gold-arrow)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
        <path d="M 45 125 A 62 62 0 0 1 58 52" stroke="url(#gold-arrow)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
        <path d="M 132 155 A 62 62 0 0 1 68 155" stroke="url(#gold-arrow)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowhead)"/>
      </svg>
      
      <div class="lang-pill arabic">ARABIC</div>
      <div class="lang-pill malayalam">MALAYALAM</div>
      <div class="lang-pill english">ENGLISH</div>
    </div>
  </main>

  <footer>
    <button class="home-btn" onclick="window.location.href='dictionary home.html'" aria-label="Home">

    </button>
  </footer>
